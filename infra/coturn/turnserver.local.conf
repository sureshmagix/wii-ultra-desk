# LOCAL TEST FIXTURE ONLY.  No TLS certificate is configured here, so it must
# never be used beyond loopback development.  The generated shared secret is
# supplied as a container argument rather than checked into this file.
listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
realm=wii-ultra-desk.local
server-name=wii-ultra-desk-local-turn
min-port=49160
max-port=49170
user-quota=2
total-quota=8
stale-nonce=600
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# The loopback peer exception is required only to prove a same-host allocation.
# It is intentionally narrow; every other RFC1918, link-local, CGNAT, multicast
# and unspecified IPv4 range remains denied.  Production must remove this
# exception and impose equivalent firewall egress restrictions.
allowed-peer-ip=127.0.0.1
allowed-peer-ip=::1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
