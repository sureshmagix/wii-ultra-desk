[package]
name = "wii-ultra-desk-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "wii_ultra_desk_agent"
path = "src/lib.rs"

[dependencies]
async-trait = "=0.1.89"
ambient-authority = "=0.0.2"
base64 = "=0.22.1"
bytes = "=1.12.1"
cap-std = "=4.0.3"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
futures-util = "=0.3.32"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "=0.2.190"
portable-pty = "=0.9.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
snow = "=0.10.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "=2.5.8"
webrtc = "=0.21.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "=0.6.1", default-features = false, features = ["platform_specific"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
xcap = "=0.9.8"
