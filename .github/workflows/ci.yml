name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Lint JavaScript and repository hygiene
        run: npm run lint
      - name: Run Node tests
        run: npm test
      - name: Verify native-agent build and tests
        run: |
          cargo fmt --manifest-path agent/Cargo.toml -- --check
          cargo build --manifest-path agent/Cargo.toml --locked
          cargo test --manifest-path agent/Cargo.toml --locked
